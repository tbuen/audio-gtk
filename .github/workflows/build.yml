name: build

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S git gtk4 pkgconf rust --noconfirm
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: build
        run: cargo build
